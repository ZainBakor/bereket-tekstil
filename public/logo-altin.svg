<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="premium-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#8B6914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD7F32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shina/Highlight Gradient -->
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:white;stop-opacity:0" />
      <stop offset="100%" style="stop-color:black;stop-opacity:0.2" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="premium-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#premium-shadow)">
    <!-- Tassel Holder -->
    <circle cx="155" cy="110" r="3" fill="#8B6914" />
    <!-- Tassel String -->
    <path d="M155 110 L165 140" stroke="#B8860B" stroke-width="2" stroke-linecap="round" />
    <!-- Tassel Body -->
    <path d="M160 140 L170 140 L175 180 L155 180 Z" fill="url(#premium-gold)" stroke="#8B6914" stroke-width="0.5" />
    
    <!-- Main Top Diamond (Mortarboard) -->
    <!-- Mimicking the sharp angles of the user's second image -->
    <path d="M100 40 L180 85 L100 130 L20 85 Z" fill="url(#premium-gold)" stroke="#5C440A" stroke-width="1.5" />
    
    <!-- Top Part Shine Overlay -->
    <path d="M100 40 L180 85 L100 130 L20 85 Z" fill="url(#shine-grad)" style="mix-blend-mode: overlay" />

    <!-- Cap Base (the part that fits on head) -->
    <!-- Sharp, slightly curved bottom edge as seen in the image -->
    <path d="M45 105 Q100 130 155 105 L155 135 L100 155 L45 135 Z" fill="url(#premium-gold)" stroke="#5C440A" stroke-width="1.5" />
    
    <!-- Detail Line on Base -->
    <path d="M45 105 Q100 130 155 105" fill="none" stroke="#5C440A" stroke-width="0.5" />
  </g>
</svg>
